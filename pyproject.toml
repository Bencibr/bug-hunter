[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-hunter-agent"
version = "0.0.8"
description = "Adversarial white-box and black-box auditing agent for OpenCode"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
tui = ["pexpect==4.9.0"]

[tool.setuptools]
packages = []

[tool.bug-hunter]
node = ">=24,<27"
playwright-mcp = "0.0.79"
playwright-browser = "1.63.0-alpha-2026-08-05"
postmcp = "1.0.3"
agent-tty = "0.5.0"
pexpect = "4.9.0"

[tool.ruff]
target-version = "py311"
line-length = 100
